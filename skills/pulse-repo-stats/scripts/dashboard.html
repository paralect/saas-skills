<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PULSE_TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23221e1b'/%3E%3Cpath d='M3 16.5h6.2l2.3-6.4a1 1 0 0 1 1.9.1l3.2 11.2 2.4-8.3a1 1 0 0 1 1.9-.1l1.7 3.5H29' fill='none' stroke='%23cb2e6a' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Tailwind, compiled in the browser so nothing needs installing. Pinned by hash. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.4/dist/index.global.js" integrity="sha384-LhJn7QKq7hHz9EqN//RkaYS9p1ZU3MqAxjeV0JI95iQ5Gol1uz/cQQ+pesz0xum7" crossorigin="anonymous"></script>
<style>
  /* Hidden until Tailwind's rules arrive (see the end of the theme), so the page doesn't flash unstyled. */
  body { opacity: 0; background: #f6f3ef; }
</style>
<style type="text/tailwindcss">
  /* The Pulse palette: warm greige paper, near-black ink, one cerise signal color. */
  @theme static {
    --font-sans: "Spline Sans", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Bricolage Grotesque", "Spline Sans", ui-sans-serif, sans-serif;

    --color-background: #f6f3ef;
    --color-foreground: #221e1b;
    --color-card: #fcfbf9;
    --color-primary-foreground: #faf8f5;
    --color-border: #e5dfd6;
    --color-border-strong: #d3cbbf;

    --color-brand: #cb2e6a;
    --color-ink: #221e1b;
    --color-good: #2f7d4f;
    --color-steel: #38699f;
    --color-amber: #c07c10;
    --color-moss: #3f8046;
    --color-text-secondary: #5e574f;
    --color-text-tertiary: #7c746a;
    --color-grey-200: #f6f3ef;
    --color-grey-300: #efeae2;
    --color-grey-400: #e7e1d9;
    --color-grey-500: #ded7cc;
    --color-grey-600: #d3cbbf;

    --radius-lg: 0.625rem;
    --radius-xl: 0.875rem;

    --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-md: 0 8px 24px -6px rgba(16, 24, 40, 0.1);
  }
  @layer base {
    * { @apply border-border; }
    html { @apply font-sans antialiased; font-feature-settings: "ss01", "cv11"; }
    body { @apply bg-background text-foreground; }
    button { cursor: pointer; }
    .tabular { font-variant-numeric: tabular-nums; }
  }
  html body { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" hidden class="pointer-events-none fixed z-50 w-max max-w-80 -translate-x-1/2 -translate-y-full rounded-lg bg-ink px-3 py-2 text-sm text-primary-foreground shadow-md"></div>
<script id="pulse-data" type="application/json">__PULSE_DATA__</script>
<script>
// Everything below draws the page from the numbers above. It sends nothing anywhere.
const DATA = JSON.parse(document.getElementById("pulse-data").textContent);
const gh = DATA.metrics;
const WINDOW_WEEKS = 12;
const COMMIT_WEEKS = 26;
const DAY_MS = 86_400_000;
const WEEK_MS = 7 * DAY_MS;
const asOf = gh.asOf ?? Date.now();

setTimeout(() => { document.body.style.opacity = 1; }, 2500); // Tailwind didn't load: show the page anyway.

const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, word, many = `${word}s`) => `${n.toLocaleString("en-US")} ${n === 1 ? word : many}`;
const shortDate = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const tip = (html) => `data-tip="${esc(html)}"`;

const icon = (paths, cls) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths.map((d) => `<path d="${d}"/>`).join("")}</svg>`;
const ICON = {
  arrowRight: (c) => icon(["M5 12h14", "m12 5 7 7-7 7"], c),
  arrowUpRight: (c) => icon(["M7 7h10v10", "M7 17 17 7"], c),
  check: (c) => icon(["M20 6 9 17l-5-5"], c),
  minus: (c) => icon(["M5 12h14"], c),
  help: (c) => icon(["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z", "M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3", "M12 17h.01"], c),
  trophy: (c) => icon(["M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2", "M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2", "M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3", "M4 22h16", "M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z", "M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"], c),
};

// Durations in the unit a person would say out loud.
function splitHours(hours) {
  if (hours < 1) { const m = Math.max(1, Math.round(hours * 60)); return { value: String(m), unit: "min" }; }
  if (hours < 48) return { value: String(hours < 10 ? Math.round(hours * 10) / 10 : Math.round(hours)), unit: "h" };
  const days = hours / 24;
  return { value: String(days < 10 ? Math.round(days * 10) / 10 : Math.round(days)), unit: "d" };
}

// ---- People ----

const profileUrl = (p) => {
  const bot = p.login.match(/^(.+)\[bot\]$/i);
  return bot || p.app ? `https://github.com/apps/${bot ? bot[1] : p.login}` : `https://github.com/${p.login}`;
};
const initial = (p, cls) => `<span class="grid size-7 shrink-0 place-items-center rounded-full bg-grey-400 text-xs font-semibold text-text-secondary ${cls}">${esc(p.login.slice(0, 1).toUpperCase())}</span>`;
const avatar = (p, cls = "") => p.avatar
  ? `<img src="${esc(p.avatar)}" alt="" loading="lazy" data-fallback="${esc(initial(p, cls))}" class="size-7 shrink-0 rounded-full bg-grey-300 object-cover ${cls}">`
  : initial(p, cls);
const personLine = (p) => [
  p.merged && plural(p.merged, "PR merged", "PRs merged"),
  p.reviews && plural(p.reviews, "review"),
  p.commits && plural(p.commits, "commit"),
].filter(Boolean).join(" · ");
const face = (p, cls) => `<a href="${esc(profileUrl(p))}" target="_blank" rel="noreferrer" aria-label="${esc(p.login)}" class="relative inline-flex hover:z-30" ${tip(`<span class="flex flex-col items-center text-center"><span class="font-semibold">${esc(p.login)}</span><span class="text-xs text-white/90">${esc(personLine(p) || "No activity")}</span></span>`)}>${avatar(p, `ring-2 ring-card ${cls}`)}</a>`;

// ---- Verdicts ----

const TONE = { good: "text-good", warn: "text-amber", bad: "text-brand" };

function verdict(row) {
  if (row.key === "ships") {
    const missed = Number(row.value.unit.replace("/", "")) - Number(row.value.value);
    return missed === 0 ? "Every week" : `${missed} missed`;
  }
  if (row.tone === "good") return "On target";
  return `${row.ratio < 10 ? Math.round(row.ratio * 10) / 10 : Math.round(row.ratio)}× target`;
}

function explain(row) {
  if (row.key === "ships") {
    const read = row.value.unit.replace("/", "");
    return row.tone === "good"
      ? `A release in every one of the ${read} weeks read. Healthy teams ship weekly.`
      : `${verdict(row)}: weeks with no release, of the ${read} read. Healthy teams ship weekly.`;
  }
  const line = `Here: ${row.value.long}. Healthy teams: ${row.healthy}.`;
  if (row.tone === "good") return `${line} This team is within that line.`;
  const x = verdict(row).replace(" target", "");
  return `${line} ${x} target means ${x} that line.`;
}

const verdictBadge = (row) => `<button type="button" class="inline-flex shrink-0 cursor-help items-center gap-1 text-xs font-medium whitespace-nowrap tabular outline-none focus-visible:underline ${TONE[row.tone]}" ${tip(`<span class="flex flex-col items-start gap-1 text-[13px] leading-snug"><span class="font-medium">${esc(row.label)}</span>${row.key !== "ships" ? `<span class="text-primary-foreground/70">${esc(row.means)}.</span>` : ""}<span>${esc(explain(row))}</span><span class="text-xs text-primary-foreground/60">Targets come from DORA and LinearB benchmarks for healthy product teams.</span></span>`)}>${esc(verdict(row))}${ICON.help("size-3 opacity-60")}</button>`;

const NUMBER = "font-display text-[30px] leading-none font-semibold tracking-[-0.03em] tabular";
const UNIT = "ml-0.5 text-base font-medium tracking-normal text-text-tertiary";
const DASH = `<p class="text-[30px] leading-none font-semibold text-grey-500">–</p>`;
const rowNumber = (row, cls = "shrink-0") => row
  ? `<p class="${cls} ${NUMBER}"><span data-count="${esc(row.value.value)}">${esc(row.value.value)}</span><span class="${UNIT}">${esc(row.value.unit)}</span></p>`
  : DASH;

// ---- The metrics strip ----

const SHIP_SOURCE = {
  releases: "GitHub releases",
  deploys: "production deploys",
  branch: "merges to the production branch",
  tags: "version tags",
  push: "pushes to the default branch (no releases or deploys found)",
};

function releaseWeeks() {
  const hit = new Set((gh.ships ?? []).map((t) => WINDOW_WEEKS - 1 - Math.floor((asOf - t) / WEEK_MS)));
  const cells = Array.from({ length: WINDOW_WEEKS }, (_, i) => {
    const start = new Date(asOf - (WINDOW_WEEKS - i) * WEEK_MS);
    const shipped = hit.has(i);
    const read = shipped || gh.shipsFrom == null || start.getTime() + WEEK_MS > gh.shipsFrom;
    return `<span class="flex-1 rounded-[3px] ${shipped ? "bg-good" : read ? "bg-brand/15" : "bg-grey-300"}" ${tip(`<span class="font-semibold">Week of ${shortDate(start)}</span><span class="text-white/80"> · ${shipped ? "released" : read ? "no release" : "not read"}</span>`)}></span>`;
  });
  return `<div class="relative flex h-[30px] min-w-0 flex-1 gap-[3px]">${cells.join("")}</div>`;
}

function kpiReleases(row) {
  const hint = gh.shipSource
    ? `Weeks with a release, of the last ${WINDOW_WEEKS}. From ${SHIP_SOURCE[gh.shipSource] ?? gh.shipSource}.`
    : `Weeks with a release, of the last ${WINDOW_WEEKS}.`;
  return `<div class="flex min-w-0 flex-col gap-3 bg-card p-4 rounded-xl border border-border sm:col-span-2 lg:col-span-1">
    <div class="flex items-center justify-between gap-2">
      <h3 class="truncate text-[13px] font-medium" title="${esc(hint)}">Release weeks</h3>
      ${row ? verdictBadge(row) : ""}
    </div>
    <div class="flex min-w-0 items-end gap-5">${rowNumber(row)}${releaseWeeks()}</div>
  </div>`;
}

const smallBars = (values) => {
  const max = Math.max(1, ...values);
  return `<span class="flex h-[30px] w-20 min-w-0 shrink items-end gap-[2px]">${values.map((v) => `<span class="flex-1 rounded-t-[2px]" style="height:${Math.max(6, (v / max) * 100)}%;background-color:color-mix(in srgb, var(--color-steel) 45%, transparent)"></span>`).join("")}</span>`;
};

const cell = (label, hint, n, unit, inner) => `<div class="flex min-w-0 flex-col gap-3 rounded-xl border border-border bg-card p-4">
  <h3 class="truncate text-[13px] font-medium" title="${esc(hint)}">${label}</h3>
  <div class="flex min-w-0 items-end justify-between gap-4">
    <p class="shrink-0 ${NUMBER}">${Math.round(n).toLocaleString("en-US")}${unit ? `<span class="${UNIT}">${unit}</span>` : ""}</p>
    ${inner}
  </div>
</div>`;

function throughput() {
  const commitWeeks = Array.from({ length: WINDOW_WEEKS }, () => 0);
  for (const [day, n] of gh.commitDays ?? []) {
    const w = Math.floor((asOf - Date.parse(day)) / WEEK_MS);
    if (w >= 0 && w < WINDOW_WEEKS) commitWeeks[WINDOW_WEEKS - 1 - w] += n;
  }
  const prWeeks = prWeekList.map((w) => w.total);
  const avg = (list) => (list.length ? list.reduce((a, n) => a + n, 0) / list.length : 0);
  const hint = `Average week, last ${WINDOW_WEEKS} weeks`;
  return cell("PRs merged", hint, avg(prWeeks), "/week", smallBars(prWeeks)) + cell("Commits", hint, avg(commitWeeks), "/week", smallBars(commitWeeks));
}

function peopleCell() {
  const humans = gh.people.filter((p) => !p.agent);
  const faces = humans.filter((p) => p.avatar).slice(0, 10);
  return cell("People", `Committed, merged or reviewed in the last ${WINDOW_WEEKS} weeks`, gh.peopleTotal ?? humans.length, "", `<span class="flex -space-x-1.5">${faces.map((p) => face(p, "size-6")).join("")}</span>`);
}

// ---- Merged PRs per week ----

const prWeekList = (gh.weeklyPrs ?? []).slice(-WINDOW_WEEKS);
const SEGMENTS = [
  { key: "fast", label: "reviewed within a day", color: "var(--color-moss)" },
  { key: "slow", label: "waited over a day", color: "var(--color-brand)" },
  { key: "unreviewed", label: "no review", color: "var(--color-grey-600)" },
];

function legend() {
  const items = [["Reviewed < 1 day", "var(--color-moss)"], ["Waited longer", "var(--color-brand)"], ["No review", "var(--color-grey-600)"]];
  if (prWeekList.some((w) => w.total > 0 && w.fast + w.slow + w.unreviewed === 0)) {
    items.push(["Not sampled", "color-mix(in srgb, var(--color-steel) 40%, transparent)"]);
  }
  return `<div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-text-tertiary">${items.map(([label, color]) => `<span class="inline-flex items-center gap-1.5"><span class="size-2 rounded-[2px]" style="background-color:${color}"></span>${esc(label)}</span>`).join("")}</div>`;
}

function prWeeks() {
  const weeks = prWeekList;
  if (weeks.every((w) => w.total === 0)) return `<p class="text-sm text-text-tertiary">No merged pull requests.</p>`;
  const max = Math.max(1, ...weeks.map((w) => w.total));
  const label = (i) => shortDate(new Date(asOf - (weeks.length - i) * WEEK_MS));
  const bars = weeks.map((w, i) => {
    const sampled = w.fast + w.slow + w.unreviewed;
    const lines = sampled > 0 ? SEGMENTS.filter((s) => w[s.key]).map((s) => `<span class="inline-flex items-center gap-1.5 text-xs text-white/90"><span class="size-2 rounded-full" style="background-color:${s.color}"></span>${Math.round((w[s.key] / sampled) * 100)}% ${s.label}</span>`).join("") : "";
    const ai = w.agent || w.agentReviewed
      ? `<span class="text-xs text-white/90">AI agents: ${w.agent ? `opened ~${w.agent}` : ""}${w.agent && w.agentReviewed ? ", " : ""}${w.agentReviewed ? `reviewed ~${w.agentReviewed}` : ""}</span>`
      : "";
    const fill = sampled === 0
      ? `<span class="h-full bg-steel/40"></span>`
      : SEGMENTS.filter((s) => w[s.key]).map((s) => `<span style="height:${(w[s.key] / sampled) * 100}%;background-color:${s.color}"></span>`).join("");
    return `<div class="flex h-full flex-1 flex-col justify-end" ${tip(`<div class="flex flex-col gap-1"><span class="whitespace-nowrap"><span class="font-semibold">Week of ${label(i)}</span><span class="text-white/90"> · ${plural(w.total, "PR merged", "PRs merged")}</span></span>${lines}${ai}</div>`)}><div class="flex w-full flex-col-reverse overflow-hidden rounded-[3px] hover:opacity-85" style="height:${(w.total / max) * 100}%">${fill}</div></div>`;
  }).join("");
  const labels = weeks.map((_, i) => `<span class="flex-1 text-center text-[11px] whitespace-nowrap text-text-tertiary">${i % 2 === 0 ? label(i) : ""}</span>`).join("");
  return `<div class="relative flex flex-1 flex-col">
    <span class="text-[11px] text-text-tertiary tabular">${max}</span>
    <div class="flex min-h-36 flex-1 items-end gap-1.5 border-b border-border pt-1">${bars}</div>
    <div class="flex gap-1.5 pt-1.5">${labels}</div>
  </div>`;
}

function reviews() {
  const row = (key) => DATA.rows.find((r) => r.key === key);
  const rows = [["Review wait", row("reviewWait")], ["Time to merge", row("merge")], ["Merged unreviewed", row("unreviewed")]];
  return `<section class="flex min-w-0 flex-col rounded-xl border border-border bg-card p-4">
    <div class="flex items-baseline justify-between gap-3 pb-1">
      <h3 class="text-[13px] font-medium">Reviews</h3>
      <span class="text-xs text-text-tertiary">Last ${WINDOW_WEEKS} weeks</span>
    </div>
    <dl class="flex flex-1 flex-col justify-around">${rows.map(([label, r]) => `
      <div class="flex items-center justify-between gap-4 border-t border-border py-3 first:border-t-0">
        <dt class="flex min-w-0 flex-col gap-1"><span class="truncate text-[13px] text-text-secondary" title="${esc(r?.means ?? "")}">${label}</span></dt>
        <dd class="shrink-0">${rowNumber(r, "")}</dd>
      </div>`).join("")}
    </dl>
  </section>`;
}

// ---- Commits: the contribution grid ----

function activityGrid() {
  const CELL = 14, GAP = 3, STEP = CELL + GAP, LEFT = 18, TOP = 16, WEEKS = COMMIT_WEEKS;
  const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const heatColor = (l) => (l === 0 ? "var(--color-grey-300)" : `color-mix(in srgb, var(--color-steel) ${[0, 30, 52, 76, 100][l]}%, var(--color-grey-200))`);
  const byDay = new Map((gh.commitDays ?? []).map(([day, count, who]) => [day, { count, who }]));
  const byLogin = new Map(gh.people.map((p) => [p.login, p]));
  const now = new Date(asOf);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const first = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay() - (WEEKS - 1) * 7);
  const cells = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const date = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i);
    const hit = byDay.get(dayKey(date));
    cells.push({ date, count: hit?.count ?? 0, who: hit?.who ?? [], future: date > today });
  }
  let months = [];
  for (let col = 0; col < WEEKS; col++) {
    const d = cells[col * 7].date;
    const prev = col > 0 ? cells[(col - 1) * 7].date : null;
    if ((!prev || prev.getMonth() !== d.getMonth()) && col < WEEKS - 1) months.push({ col, label: d.toLocaleDateString("en-US", { month: "short" }) });
  }
  if (months[1] && months[1].col - months[0].col < 3) months = months.slice(1);
  // Quartiles of active days, so one huge day doesn't wash out the rest.
  const active = cells.map((c) => c.count).filter((n) => n > 0).sort((a, b) => a - b);
  const at = (q) => active[Math.floor((active.length - 1) * q)] ?? 1;
  const cuts = [at(0.25), at(0.5), at(0.75)];
  const level = (n) => (n === 0 ? 0 : n <= cuts[0] ? 1 : n <= cuts[1] ? 2 : n <= cuts[2] ? 3 : 4);
  const total = cells.reduce((a, c) => a + c.count, 0);
  const width = LEFT + WEEKS * STEP - GAP;
  const height = TOP + 7 * STEP - GAP;

  const rects = cells.map((c, i) => {
    if (c.future) return "";
    const col = Math.floor(i / 7);
    const row = i % 7;
    const who = c.who.map((login) => `<span class="inline-flex items-center gap-1.5 text-xs text-white">${avatar(byLogin.get(login) ?? { login, avatar: null }, "size-5")}${esc(login)}</span>`).join("");
    const when = c.date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    return `<rect x="${LEFT + col * STEP}" y="${TOP + row * STEP}" width="${CELL}" height="${CELL}" rx="3" class="hover:opacity-70" style="fill:${heatColor(level(c.count))}" ${tip(`<div class="flex flex-col gap-1.5"><span class="whitespace-nowrap"><span class="font-semibold">${when}</span><span class="text-white/90"> · ${plural(c.count, "commit")}</span></span>${who}</div>`)}></rect>`;
  }).join("");

  return `<div class="relative flex w-fit max-w-full shrink-0 flex-col gap-2">
    <svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" class="h-auto max-w-full" role="img" aria-label="${total} commits in the last ${WEEKS} weeks">
      ${months.map((m) => `<text x="${LEFT + m.col * STEP}" y="10" class="fill-text-tertiary text-[10px]">${m.label}</text>`).join("")}
      ${["M", "W", "F"].map((d, i) => `<text x="0" y="${TOP + (1 + i * 2) * STEP + CELL - 2}" class="fill-text-tertiary text-[9px]">${d}</text>`).join("")}
      ${rects}
    </svg>
    <div class="flex items-center justify-between gap-3 text-xs text-text-tertiary tabular" style="padding-left:${LEFT}px">
      <span class="truncate">${plural(total, "commit")}</span>
      <span class="flex shrink-0 items-center gap-1">Less ${[0, 1, 2, 3, 4].map((l) => `<span class="size-2 rounded-[2px]" style="background-color:${heatColor(l)}"></span>`).join("")} More</span>
    </div>
  </div>`;
}

// ---- Commits: who writes them ----

function commitShare() {
  const R = 40, C = 2 * Math.PI * R, GAP = 1.5, FACE_R = 55, MIN_APART = 0.06;
  const SHADES = [100, 78, 60, 45, 32].map((pct) => `color-mix(in srgb, var(--color-steel) ${pct}%, transparent)`);
  const committers = gh.people.filter((p) => !p.agent && p.commits > 0).sort((a, b) => b.commits - a.commits);
  const top = committers.slice(0, 5);
  const whole = Math.max(gh.humanCommits ?? 0, committers.reduce((a, p) => a + p.commits, 0));
  if (top.length < 2 || whole === 0) return "";
  const topSum = top.reduce((a, p) => a + p.commits, 0);
  const pct = (n) => `${Math.round((n / whole) * 100)}%`;
  let at = 0, lastFace = -1;
  const slices = top.map((p, i) => {
    const share = p.commits / whole;
    const start = at;
    at += share;
    const f = Math.max(start + share / 2, lastFace + MIN_APART);
    lastFace = f;
    return { person: p, share, start, face: f, color: SHADES[i] };
  });
  const arc = (start, share, color, value, label) => {
    const dash = Math.max(0.5, share * C - GAP);
    return `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${color}" stroke-width="11" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-start * C}" class="transition-[stroke-width]" data-slice data-value="${esc(value)}" data-label="${esc(label)}"></circle>`;
  };
  const rest = whole > topSum ? arc(topSum / whole, 1 - topSum / whole, "var(--color-grey-500)", pct(whole - topSum), "everyone else") : "";
  return `<div class="flex min-w-0 flex-1 flex-col lg:px-6">
    <h3 class="pb-4 text-[13px] font-medium">Who commits</h3>
    <div class="relative m-auto size-40" data-donut data-value="${pct(topSum)}" data-label="top ${top.length}">
      <svg viewBox="0 0 100 100" class="size-full -rotate-90">${rest}${slices.map((s) => arc(s.start, s.share, s.color, pct(s.person.commits), s.person.login)).join("")}</svg>
      <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center px-6 text-center">
        <span class="text-lg leading-tight font-semibold tabular" data-donut-value>${pct(topSum)}</span>
        <span class="max-w-full truncate text-[11px] text-text-tertiary" data-donut-label>top ${top.length}</span>
      </div>
      ${slices.map((s) => {
        const angle = s.face * 2 * Math.PI;
        return `<span class="absolute -translate-x-1/2 -translate-y-1/2 hover:z-30" style="left:${50 + FACE_R * Math.sin(angle)}%;top:${50 - FACE_R * Math.cos(angle)}%" data-slice data-value="${pct(s.person.commits)}" data-label="${esc(s.person.login)}">${face(s.person, "size-5")}</span>`;
      }).join("")}
    </div>
  </div>`;
}

// ---- People ----

// The true leader of each habit gets a badge; rows are the badge holders, then the strongest others.
function rank(people) {
  const badges = new Map();
  const give = (p, b) => p && badges.set(p.login, [...(badges.get(p.login) ?? []), b]);
  const top = (key) => [...people].filter((p) => p[key] > 0).sort((a, b) => b[key] - a[key])[0];
  give(top("merged"), "Most shipped");
  give(top("reviews"), "Top reviewer");
  const fastest = [...people].filter((p) => p.mergeHours != null).sort((a, b) => a.mergeHours - b.mergeHours)[0];
  if (fastest) { const t = splitHours(fastest.mergeHours); give(fastest, `Fastest merge, ${t.value}${t.unit}`); }
  give(top("commits"), "Most commits");
  const max = {
    merged: Math.max(1, ...people.map((p) => p.merged)),
    reviews: Math.max(1, ...people.map((p) => p.reviews)),
    commits: Math.max(1, ...people.map((p) => p.commits)),
  };
  const score = (p) => p.merged / max.merged + p.reviews / max.reviews + p.commits / max.commits;
  const holders = people.filter((p) => badges.has(p.login)).sort((a, b) => score(b) - score(a));
  const others = people.filter((p) => !badges.has(p.login)).sort((a, b) => score(b) - score(a));
  return [...holders, ...others].slice(0, 5).map((person) => ({ person, badges: badges.get(person.login) ?? [] }));
}

function aiCommitsPct() {
  const cutoff = new Date(asOf - WINDOW_WEEKS * WEEK_MS).toISOString().slice(0, 10);
  const inWindow = (gh.commitDays ?? []).filter(([day]) => day > cutoff).reduce((a, [, n]) => a + n, 0);
  const agents = gh.ai?.commits ?? gh.people.filter((p) => p.agent).reduce((a, p) => a + p.commits, 0);
  return inWindow > 0 ? Math.min(100, Math.round((agents / inWindow) * 100)) : null;
}

// ---- How code gets to production ----

const KIND_ORDER = ["Tests", "Lint & types", "Build", "Security", "AI review", "Preview", "Visual tests", "Coverage", "Performance", "Dependencies", "CLA", "Release", "Merge queue", "Monitoring", "Other", "Housekeeping"];
const pctOf = (n, of) => (of > 0 ? Math.round((n / of) * 100) : 0);
const muted = (s) => `<span class="font-normal text-text-tertiary">${s}</span>`;
const yes = (on, hidden = false) => (hidden && !on ? muted("Not readable") : on ? `<span aria-label="Yes">${ICON.check("size-4 text-good")}</span>` : `<span aria-label="No">${ICON.minus("size-4 text-grey-600")}</span>`);
const panel = (title, caption, inner) => `<section class="flex min-w-0 flex-col gap-4 rounded-xl border border-border bg-card p-4"><header><h3 class="text-[13px] font-medium">${esc(title)}</h3><p class="mt-0.5 text-xs text-text-tertiary">${esc(caption)}</p></header>${inner}</section>`;
const empty = (s) => `<p class="text-sm text-text-secondary">${s}</p>`;

function gatesCard(g, c) {
  if (!g) return panel("Gates on the main branch", "Rules every merge must pass", empty("Couldn't read this branch's rules."));
  const hidden = g.classic && !g.pullRequest;
  const open = !g.protected && !g.pullRequest && g.requiredChecks.length === 0;
  const rows = [
    ["Changes go through a PR", yes(g.pullRequest, hidden)],
    ["Approvals required", hidden ? muted("Not readable") : g.approvals ? g.approvals : muted("None")],
    ["Code owners must approve", yes(g.codeOwners, hidden)],
    ["Required checks", g.requiredChecks.length > 0 ? `<span title="${esc(g.requiredChecks.join("\n"))}" class="cursor-help underline decoration-dotted underline-offset-2">${g.requiredChecks.length}</span>` : muted("None")],
    ["Force-push blocked", yes(g.forcePushBlocked)],
    ["Signed commits", yes(g.signedCommits)],
    ["Linear history", yes(g.linearHistory)],
    ["Merge queue", yes(g.mergeQueue)],
  ];
  const body = open
    ? empty(`<span class="font-medium text-brand">No rules on ${esc(g.branch)}.</span> Anyone with write access can push to it directly.`)
    : `<dl class="flex flex-col divide-y divide-border text-sm">${rows.map(([label, value]) => `<div class="flex items-center justify-between gap-3 py-1.5"><dt class="text-text-secondary">${label}</dt><dd class="font-medium tabular">${value}</dd></div>`).join("")}</dl>`;
  let foot = "";
  if (c && c.sampled > 0) {
    const none = c.noReviewRule === c.sampled;
    foot = `<p class="mt-auto text-xs text-text-tertiary">Of the last ${c.sampled} merges: ${none ? "no review rule applied." : `${c.approved} approved`}${c.bypassed > 0 ? `, <span class="font-medium text-brand">${c.bypassed} merged without the required review</span>` : ""}${none ? "" : "."}</p>`;
  }
  return panel(`Gates on ${g.branch}`, "Rules every merge must pass, as set today", body + foot);
}

function checksCard(c) {
  if (!c || c.sampled === 0) return panel("What runs on every PR", "Checks on recent merged PRs", empty("No merged pull requests to read."));
  const groups = new Map();
  const same = (a, b) => (a.url != null && a.url === b.url) || a.name.toLowerCase() === b.name.toLowerCase();
  for (const t of c.tools) {
    const group = groups.get(t.kind) ?? [];
    const twin = group.findIndex((g) => same(g, t));
    if (twin < 0) group.push(t);
    else if (t.prs > group[twin].prs) group[twin] = t;
    groups.set(t.kind, group);
  }
  const kinds = KIND_ORDER.filter((k) => groups.has(k));
  const covered = pctOf(c.withChecks, c.sampled);
  const stat = (value, label, bad) => `<div><p class="font-display text-[26px] leading-none font-semibold tracking-[-0.03em] tabular ${bad ? "text-brand" : ""}">${value}</p><p class="mt-1 text-xs text-text-tertiary">${label}</p></div>`;
  const list = kinds.length === 0 ? empty("No checks ran on these pull requests.") : `<ul class="flex flex-col gap-2 text-sm">${kinds.map((kind) => {
    const tools = groups.get(kind);
    const share = pctOf(Math.max(...tools.map((t) => t.prs)), c.sampled);
    const names = tools.map((t) => (t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noreferrer" class="underline decoration-border-strong underline-offset-2 hover:text-foreground hover:decoration-current">${esc(t.name)}</a>` : esc(t.name))).join(", ");
    return `<li class="grid grid-cols-[6.5rem_minmax(0,1fr)_2.5rem] items-baseline gap-x-2"><span class="${kind === "Housekeeping" ? "text-text-tertiary" : "text-text-secondary"}">${esc(kind)}</span><span class="text-xs leading-snug text-pretty text-text-tertiary" title="${esc(tools.map((t) => `${t.name}: ${t.prs} PRs`).join("\n"))}">${names}</span><span class="text-right text-xs font-medium tabular">${share}%</span></li>`;
  }).join("")}</ul>`;
  return panel("What runs on every PR", `Checks that ran on the last ${c.sampled} merged PRs`, `<div class="flex gap-6">${stat(`${covered}%`, "had any check", covered < 80)}${stat(c.mergedRed, "merged failing", c.mergedRed > 0)}</div>${list}`);
}

function pipeline() {
  const p = DATA.pipeline;

  return `<section class="flex flex-col gap-3">

}

// ---- Behaviour: tooltips, the donut's middle, broken avatars, numbers ticking up ----

const tipEl = document.getElementById("tip");
function placeTip(x, y) {
  const half = tipEl.offsetWidth / 2;
  tipEl.style.left = `${Math.max(half + 8, Math.min(x, window.innerWidth - half - 8))}px`;
  tipEl.style.top = `${Math.max(tipEl.offsetHeight + 8, y - 14)}px`;
}
const hideTip = () => { tipEl.hidden = true; };
function showTip(target, x, y) {
  tipEl.innerHTML = target.getAttribute("data-tip");
  tipEl.hidden = false;
  placeTip(x, y);
}
let tipFor = null;
document.addEventListener("mousemove", (e) => {
  const target = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  if (!target) { tipFor = null; hideTip(); return; }
  if (target !== tipFor) { tipFor = target; showTip(target, e.clientX, e.clientY); }
  else placeTip(e.clientX, e.clientY);
});
document.addEventListener("mouseleave", hideTip);
document.addEventListener("focusin", (e) => {
  const target = e.target.closest?.("button[data-tip], span[data-tip]");
  if (!target || !target.matches(":focus-visible")) return;
  const box = target.getBoundingClientRect();
  showTip(target, box.left + box.width / 2, box.top);
});
document.addEventListener("focusout", hideTip);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });

for (const donut of document.querySelectorAll("[data-donut]")) {
  const value = donut.querySelector("[data-donut-value]");
  const label = donut.querySelector("[data-donut-label]");
  const set = (v, l) => { value.textContent = v; label.textContent = l; };
  for (const slice of donut.querySelectorAll("[data-slice]")) {
    const isArc = slice.tagName.toLowerCase() === "circle";
    slice.addEventListener("mouseenter", () => {
      set(slice.dataset.value, slice.dataset.label);
      if (isArc) slice.setAttribute("stroke-width", "14");
    });
    slice.addEventListener("mouseleave", () => {
      set(donut.dataset.value, donut.dataset.label);
      if (isArc) slice.setAttribute("stroke-width", "11");
    });
  }
}

for (const img of document.querySelectorAll("img[data-fallback]")) {
  img.addEventListener("error", () => { img.outerHTML = img.dataset.fallback; });
}

if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  for (const el of document.querySelectorAll("[data-count]")) {
    const text = el.dataset.count;
    const target = Number.parseFloat(text);
    if (!Number.isFinite(target)) continue;
    const decimals = text.includes(".") ? text.split(".")[1].length : 0;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / 900);
      el.textContent = (target * (1 - (1 - t) ** 3)).toFixed(decimals);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}
